[project]
name = "acai-backend"
version = "0.1.0"
description = "Arabic Cognitive AI backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiostream>=0.7.1",
    "ddgs>=9.14.2",
    "dotenv>=0.9.9",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "passlib>=1.7.4",
    "pillow>=12.2.0",
    "pypdf>=6.11.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.6",
    "faster-whisper>=0.8.0",
    "edge-tts>=1.0.0",
    "pyttsx3>=2.90",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
]

[tool.uv]
package = true

[project.scripts]
app = "app.main:main"

[tool.setuptools.packages.find]
include = ["app"]
